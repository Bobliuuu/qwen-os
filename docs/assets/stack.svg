<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-labelledby="t d">
<title id="t">The QwenOS stack</title><desc id="d">A keystroke travels down six layers from you to the Qwenputer circuit; a frame travels back up.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .mut{fill:#8b949e}</style>
<rect width="900" height="590" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="450" y="30" font-size="15" fill="#8b949e" text-anchor="middle" font-weight="normal" >the stack: keystroke down, frame up</text><line x1="96" y1="82.0" x2="96" y2="502.0" stroke="#30363d" stroke-width="3" stroke-dasharray="4 6"/><line x1="804" y1="82.0" x2="804" y2="502.0" stroke="#30363d" stroke-width="3" stroke-dasharray="4 6"/><text x="96" y="566" font-size="12" fill="#58a6ff" text-anchor="middle" font-weight="normal" >keystroke</text><text x="804" y="566" font-size="12" fill="#3fb950" text-anchor="middle" font-weight="normal" >frame (marker 0x02)</text><rect x="150" y="50" width="600" height="64" rx="12" fill="#161b22" stroke="#30363d" ></rect><line x1="96" y1="82.0" x2="150" y2="82.0" stroke="#30363d" stroke-width="2"/><line x1="750" y1="82.0" x2="804" y2="82.0" stroke="#30363d" stroke-width="2"/><rect x="150" y="50" width="8" height="64" rx="4" fill="#58a6ff" ></rect><text x="176" y="78" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold" >you</text><text x="176" y="99" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >type: run /bin/doomd</text><rect x="150" y="50" width="600" height="64" rx="12" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.015;0.04;0.065;1" dur="9s" repeatCount="indefinite"/></rect><rect x="150" y="50" width="600" height="64" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.915;0.94;0.965;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 116 v10 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="150" y="134" width="600" height="64" rx="12" fill="#161b22" stroke="#30363d" ></rect><line x1="96" y1="166.0" x2="150" y2="166.0" stroke="#30363d" stroke-width="2"/><line x1="750" y1="166.0" x2="804" y2="166.0" stroke="#30363d" stroke-width="2"/><rect x="150" y="134" width="8" height="64" rx="4" fill="#3fb950" ></rect><text x="176" y="162" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold" >shell</text><text x="176" y="183" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >echoes keys, ~70 instr per key</text><rect x="150" y="134" width="600" height="64" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.095;0.12;0.145;1" dur="9s" repeatCount="indefinite"/></rect><rect x="150" y="134" width="600" height="64" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.835;0.86;0.885;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 200 v10 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="150" y="218" width="600" height="64" rx="12" fill="#161b22" stroke="#30363d" ></rect><line x1="96" y1="250.0" x2="150" y2="250.0" stroke="#30363d" stroke-width="2"/><line x1="750" y1="250.0" x2="804" y2="250.0" stroke="#30363d" stroke-width="2"/><rect x="150" y="218" width="8" height="64" rx="4" fill="#d29922" ></rect><text x="176" y="246" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold" >/bin/doomd</text><text x="176" y="267" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >takes over the RAM (30,800 B)</text><rect x="150" y="218" width="600" height="64" rx="12" fill="#d29922" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.175;0.2;0.225;1" dur="9s" repeatCount="indefinite"/></rect><rect x="150" y="218" width="600" height="64" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.755;0.78;0.805;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 284 v10 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="150" y="302" width="600" height="64" rx="12" fill="#161b22" stroke="#30363d" ></rect><line x1="96" y1="334.0" x2="150" y2="334.0" stroke="#30363d" stroke-width="2"/><line x1="750" y1="334.0" x2="804" y2="334.0" stroke="#30363d" stroke-width="2"/><rect x="150" y="302" width="8" height="64" rx="4" fill="#ff9e64" ></rect><text x="176" y="330" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold" >DMC100 engine</text><text x="176" y="351" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >game tic: logic every tic, 15 of 35 drawn</text><rect x="150" y="302" width="600" height="64" rx="12" fill="#ff9e64" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.255;0.28;0.305;1" dur="9s" repeatCount="indefinite"/></rect><rect x="150" y="302" width="600" height="64" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.675;0.7;0.725;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 368 v10 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="150" y="386" width="600" height="64" rx="12" fill="#161b22" stroke="#30363d" ></rect><line x1="96" y1="418.0" x2="150" y2="418.0" stroke="#30363d" stroke-width="2"/><line x1="750" y1="418.0" x2="804" y2="418.0" stroke="#30363d" stroke-width="2"/><rect x="150" y="386" width="8" height="64" rx="4" fill="#bc8cff" ></rect><text x="176" y="414" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold" >kernel syscalls</text><text x="176" y="435" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >keys, framebuffer, disk, console</text><rect x="150" y="386" width="600" height="64" rx="12" fill="#bc8cff" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.335;0.36;0.385;1" dur="9s" repeatCount="indefinite"/></rect><rect x="150" y="386" width="600" height="64" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.595;0.62;0.645;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 452 v10 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="150" y="470" width="600" height="64" rx="12" fill="#161b22" stroke="#30363d" ></rect><line x1="96" y1="502.0" x2="150" y2="502.0" stroke="#30363d" stroke-width="2"/><line x1="750" y1="502.0" x2="804" y2="502.0" stroke="#30363d" stroke-width="2"/><rect x="150" y="470" width="8" height="64" rx="4" fill="#ff6bd6" ></rect><text x="176" y="498" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold" >Qwenputer RV32IM</text><text x="176" y="519" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >a circuit inside Qwen3.5, 1.345 chip tokens per instr</text><rect x="150" y="470" width="600" height="64" rx="12" fill="#ff6bd6" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.415;0.44;0.465;1" dur="9s" repeatCount="indefinite"/></rect><rect x="150" y="470" width="600" height="64" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.515;0.54;0.565;1" dur="9s" repeatCount="indefinite"/></rect><g opacity="0"><circle r="11" fill="#58a6ff"/><text y="4" font-size="11" text-anchor="middle" style="fill:#0d1117" class="m" font-weight="bold">k</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.035;0.46;0.475;1" dur="9s" repeatCount="indefinite"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.46;1" path="M96,82.0 V502.0"/></g><g opacity="0"><rect x="-13" y="-10" width="26" height="20" rx="3" fill="#3fb950"/><text y="4" font-size="10" text-anchor="middle" style="fill:#0d1117" class="m" font-weight="bold">0x02</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.555;0.98;0.995;1" dur="9s" repeatCount="indefinite"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;0.54;0.98" path="M804,502.0 V82.0"/></g></svg>
