<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t"><title id="t">Keyboard input, before and now</title>
<rect width="960" height="560" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="480" y="38" font-size="22" fill="#f1f3fa" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">⌨️ Keyboard input: before and now</text>
<rect x="20" y="70" width="450" height="400" rx="14" fill="#241616" stroke="#e5726b" stroke-width="2.5"/>
<text x="245" y="100" font-size="16" fill="#ffd9d6" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Before: the input was a script</text>
<text x="245" y="122" font-size="12" fill="#e8b4b0" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">used for the 3-second clip</text>
<rect x="40" y="140" width="410" height="56" rx="8" fill="#2f1d1d" stroke="#6e4a48" stroke-width="1.5"/>
<text x="245" y="163" font-size="12.5" fill="#ffd9d6" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">q_script, compiled into the game ROM</text>
<text x="245" y="183" font-size="12" fill="#e8b4b0" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no keyboard, no shell, nothing typed</text>
<rect x="70.29411764705883" y="225" width="141.47058823529412" height="34" rx="5" fill="#5b8def" stroke="#5b8def" stroke-width="0"/>
<text x="141.02941176470588" y="247" font-size="10.5" fill="#10131c" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">forward</text>
<rect x="211.76470588235296" y="225" width="38.23529411764706" height="34" rx="5" fill="#a77bff" stroke="#a77bff" stroke-width="0"/>
<text x="230.8823529411765" y="247" font-size="10.5" fill="#10131c" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">turn</text>
<rect x="250.0" y="225" width="76.47058823529412" height="34" rx="5" fill="#5b8def" stroke="#5b8def" stroke-width="0"/>
<text x="288.2352941176471" y="247" font-size="10.5" fill="#10131c" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">forward</text>
<rect x="326.47058823529414" y="225" width="38.23529411764706" height="34" rx="5" fill="#ff9f6b" stroke="#ff9f6b" stroke-width="0"/>
<text x="345.5882352941177" y="247" font-size="10.5" fill="#10131c" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">fire</text>
<rect x="364.7058823529412" y="225" width="80.29411764705883" height="34" rx="5" fill="#5b8def" stroke="#5b8def" stroke-width="0"/>
<text x="404.8529411764706" y="247" font-size="10.5" fill="#10131c" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">forward</text>
<text x="55" y="282" font-size="10.5" fill="#a89a98" text-anchor="start" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">game tic 0</text>
<text x="445" y="282" font-size="10.5" fill="#a89a98" text-anchor="end" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">tic 102</text>
<rect x="55" y="216" width="3" height="52" rx="1.5" fill="#ffffff"><animate attributeName="x" values="55;445;445" keyTimes="0;0.8;1" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="245" y="318" font-size="12" fill="#e8b4b0" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">buttons are held by the script each tic:</text>
<text x="245" y="348" font-size="20" fill="#ffd166" text-anchor="middle" font-weight="800" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" opacity="0">▶ forward<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0299;0.0300;0.1900;0.1901;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="245" y="348" font-size="20" fill="#ffd166" text-anchor="middle" font-weight="800" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" opacity="0">▶ turn right<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1899;0.1900;0.2400;0.2401;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="245" y="348" font-size="20" fill="#ffd166" text-anchor="middle" font-weight="800" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" opacity="0">▶ forward<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2399;0.2400;0.3700;0.3701;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="245" y="348" font-size="20" fill="#ffd166" text-anchor="middle" font-weight="800" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" opacity="0">▶ fire<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3699;0.3700;0.4200;0.4201;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="245" y="348" font-size="20" fill="#ffd166" text-anchor="middle" font-weight="800" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" opacity="0">▶ forward<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4199;0.4200;0.8000;0.8001;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="245" y="392" font-size="12" fill="#e8b4b0" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Frames were real DOOM, but no one pressed a key,</text>
<text x="245" y="410" font-size="12" fill="#e8b4b0" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">and the typed boot-to-DOOM flow had not been run</text>
<text x="245" y="428" font-size="12" fill="#e8b4b0" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">on the model.</text>
<text x="245" y="455" font-size="11.5" fill="#ffd9d6" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">input = compiled-in script (q_script)</text>
<path d="M472 270 H488" stroke="#8b93a7" stroke-width="3" fill="none"/><path d="M482 262 L492 270 L482 278 z" fill="#8b93a7"/>
<rect x="490" y="70" width="450" height="400" rx="14" fill="#12261c" stroke="#3ecf8e" stroke-width="2.5"/>
<text x="715" y="100" font-size="16" fill="#d8ffe9" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Now: typed keys through the key ring</text>
<text x="715" y="122" font-size="12" fill="#a8e8c6" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">verified on the real model</text>
<rect x="510" y="140" width="410" height="200" rx="8" fill="#0d1a14" stroke="#2a6b4c" stroke-width="1.5"/>
<text x="525" y="170" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">$ help<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0999;0.1000;0.9600;0.9601;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="525" y="190" font-size="12" fill="#a8e8c6" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">(the shell replies)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1899;0.1900;0.9600;0.9601;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="525" y="215" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">$ ls<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2999;0.3000;0.9600;0.9601;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="525" y="235" font-size="12" fill="#a8e8c6" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">(the shell lists the disk)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3899;0.3900;0.9600;0.9601;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="525" y="260" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">$ run /bin/doomd<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4999;0.5000;0.9600;0.9601;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="525" y="305" font-size="12" fill="#a8e8c6" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">doomd: engine init, level load<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5999;0.6000;0.9600;0.9601;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="525" y="325" font-size="12" fill="#ffd166" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" opacity="0">DOOMD_LEVEL_START e1m1  ● frame marker<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7199;0.7200;0.9600;0.9601;1.0000" dur="10.0s" repeatCount="indefinite"/></text>
<text x="715" y="372" font-size="13" fill="#d8ffe9" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">23 typed keys: help⏎  ls⏎  run /bin/doomd⏎</text>
<text x="715" y="394" font-size="12" fill="#a8e8c6" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">host pushes one byte at each park point (key ring),</text>
<text x="715" y="412" font-size="12" fill="#a8e8c6" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no hardware interrupts, no scripted input</text>
<text x="715" y="438" font-size="11.5" fill="#d8ffe9" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">model-verified: 8.2 M instructions, 27 segments, zero divergence</text>
<text x="715" y="456" font-size="11" fill="#8fcfae" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">(gameplay keys while DOOM runs: not run on the model yet)</text>
<rect x="20" y="486" width="920" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="480" y="510" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Before: the model verified the instructions of a scripted clip.  Now: it also verified the typed boot -> shell -> DOOM flow.</text>
<text x="480" y="530" font-size="12" fill="#9aa3bb" text-anchor="middle" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Host's job in both cases: forward input, serve disk blocks, write PNGs. The model executes everything else.</text>
</svg>