<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d"><title id="t">Verified versus host</title><desc id="d">What the Qwen model checked in lockstep, and what the host did, for the 3-second clip.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><rect width="900" height="430" rx="16" fill="#0d1117" stroke="#30363d"/><text x="450" y="32" font-size="16" text-anchor="middle" font-weight="bold">&#128269; What is verified, and what is the host</text><rect x="30" y="55" width="410" height="330" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="235" y="88" font-size="17" font-weight="bold" text-anchor="middle" style="fill:#3fb950">&#9989; Checked by the Qwen model</text><text x="235" y="108" font-size="12" class="mut" text-anchor="middle">instruction by instruction, in lockstep, zero divergence</text><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.100;0.267;1" dur="3s" fill="freeze"/><circle cx="58" cy="141" r="6" fill="#3fb950"/><text x="74" y="145" font-size="13">81,065,591 guest RISC-V instructions executed</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.217;0.383;1" dur="3s" fill="freeze"/><circle cx="58" cy="181" r="6" fill="#3fb950"/><text x="74" y="185" font-size="13">instruction count matches the plan, every chunk</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.500;1" dur="3s" fill="freeze"/><circle cx="58" cy="221" r="6" fill="#3fb950"/><text x="74" y="225" font-size="13">frame markers emitted: 45 of 45 frames</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.450;0.617;1" dur="3s" fill="freeze"/><circle cx="58" cy="261" r="6" fill="#3fb950"/><text x="74" y="265" font-size="13">console bytes match the oracle</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.567;0.733;1" dur="3s" fill="freeze"/><circle cx="58" cy="301" r="6" fill="#3fb950"/><text x="74" y="305" font-size="13">real Qwen3.5-4B-based CPU, 35 chunks</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.683;0.850;1" dur="3s" fill="freeze"/><circle cx="58" cy="341" r="6" fill="#3fb950"/><text x="74" y="345" font-size="13">the engine ran as real guest code, not a mock</text></g><rect x="460" y="55" width="410" height="330" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="665" y="88" font-size="17" font-weight="bold" text-anchor="middle" style="fill:#58a6ff">&#128295; Done by the host (disclosed)</text><text x="665" y="108" font-size="12" class="mut" text-anchor="middle">stated plainly, nothing hidden</text><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.100;0.267;1" dur="3s" fill="freeze"/><circle cx="488" cy="141" r="6" fill="#58a6ff"/><text x="504" y="145" font-size="13">pixel bytes read from guest memory by the emulator</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.217;0.383;1" dur="3s" fill="freeze"/><circle cx="488" cy="181" r="6" fill="#58a6ff"/><text x="504" y="185" font-size="13">35 boundary instructions host-executed</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.500;1" dur="3s" fill="freeze"/><circle cx="488" cy="221" r="6" fill="#58a6ff"/><text x="504" y="225" font-size="13">keys are scripted, not typed live</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.450;0.617;1" dur="3s" fill="freeze"/><circle cx="488" cy="261" r="6" fill="#58a6ff"/><text x="504" y="265" font-size="13">clock is virtual (about 1 ms per idle call)</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.567;0.733;1" dur="3s" fill="freeze"/><circle cx="488" cy="301" r="6" fill="#58a6ff"/><text x="504" y="305" font-size="13">each chunk starts from a host snapshot</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.683;0.850;1" dur="3s" fill="freeze"/><circle cx="488" cy="341" r="6" fill="#58a6ff"/><text x="504" y="345" font-size="13">disk served via chunk-ROM windows (4 requests)</text></g><text x="450" y="412" font-size="12" class="mut" text-anchor="middle">The frames are genuine DOOM output. Qwen did not decode the pixels: it verified the instruction trace that produced them.</text></svg>