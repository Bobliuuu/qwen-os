<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Verified versus host</title><desc id="d">What the Qwen model computed and the oracle checked, what the host does, and what is not covered.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><defs></defs><rect width="960" height="470" rx="16" fill="#0d1117" stroke="#30363d"/><text x="480" y="32" font-size="16" text-anchor="middle" font-weight="bold">&#128269; What the model does, what the host does</text><rect x="20" y="52" width="300" height="360" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="170.0" y="82" font-size="15" font-weight="bold" text-anchor="middle" style="fill:#bc8cff">&#129504; Computed by the model</text><text x="170.0" y="101" font-size="11" class="mut" text-anchor="middle">every token lockstep-checked, zero divergence</text><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.100;0.267;1" dur="3s" fill="freeze"/><circle cx="40" cy="128" r="5" fill="#bc8cff"/><text x="54" y="132" font-size="12">every guest instruction (real</text><text x="54" y="148" font-size="12">Qwen3.5-4B-based CPU)</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.367;1" dur="3s" fill="freeze"/><circle cx="40" cy="172" r="5" fill="#bc8cff"/><text x="54" y="176" font-size="12">pixel bytes of the decoded frames</text><text x="54" y="192" font-size="12">(BYTE tokens, rows 0-199)</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.300;0.467;1" dur="3s" fill="freeze"/><circle cx="40" cy="216" r="5" fill="#bc8cff"/><text x="54" y="220" font-size="12">the typed flow: boot, shell, help, ls,</text><text x="54" y="236" font-size="12">run /bin/doomd, first frame</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.567;1" dur="3s" fill="freeze"/><circle cx="40" cy="260" r="5" fill="#bc8cff"/><text x="54" y="264" font-size="12">console output: 273 bytes, identical</text><text x="54" y="280" font-size="12">to the emulator</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.667;1" dur="3s" fill="freeze"/><circle cx="40" cy="304" r="5" fill="#bc8cff"/><text x="54" y="308" font-size="12">the v1 clip: 81,065,591 instructions</text></g><rect x="330" y="52" width="300" height="360" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="480.0" y="82" font-size="15" font-weight="bold" text-anchor="middle" style="fill:#8b949e">&#128295; Done by the host</text><text x="480.0" y="101" font-size="11" class="mut" text-anchor="middle">disclosed, nothing hidden</text><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.100;0.267;1" dur="3s" fill="freeze"/><circle cx="350" cy="128" r="5" fill="#8b949e"/><text x="364" y="132" font-size="12">keys: scripted, or delivered at</text><text x="364" y="148" font-size="12">qos_key_park via the key ring</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.367;1" dur="3s" fill="freeze"/><circle cx="350" cy="172" r="5" fill="#8b949e"/><text x="364" y="176" font-size="12">virtual clock (about 1 ms per idle call)</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.300;0.467;1" dur="3s" fill="freeze"/><circle cx="350" cy="216" r="5" fill="#8b949e"/><text x="364" y="220" font-size="12">disk served via chunk-ROM windows</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.567;1" dur="3s" fill="freeze"/><circle cx="350" cy="260" r="5" fill="#8b949e"/><text x="364" y="264" font-size="12">chunks start from host snapshots</text><text x="364" y="280" font-size="12">(v1 clip: 35 boundary instructions)</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.667;1" dur="3s" fill="freeze"/><circle cx="350" cy="304" r="5" fill="#8b949e"/><text x="364" y="308" font-size="12">collects pixel bytes, palette, PNG</text></g><rect x="640" y="52" width="300" height="360" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="790.0" y="82" font-size="15" font-weight="bold" text-anchor="middle" style="fill:#d29922">&#9888;&#65039; Not covered</text><text x="790.0" y="101" font-size="11" class="mut" text-anchor="middle">so nobody has to guess</text><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.100;0.267;1" dur="3s" fill="freeze"/><circle cx="660" cy="128" r="5" fill="#d29922"/><text x="674" y="132" font-size="12">status-bar rows 208-239</text><text x="674" y="148" font-size="12">(not in a frame's dump)</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.367;1" dur="3s" fill="freeze"/><circle cx="660" cy="172" r="5" fill="#d29922"/><text x="674" y="176" font-size="12">full 45/45 model-decoded frames:</text><text x="674" y="192" font-size="12">see the progress line in the README</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.300;0.467;1" dur="3s" fill="freeze"/><circle cx="660" cy="216" r="5" fill="#d29922"/><text x="674" y="220" font-size="12">the new tuned build over the</text><text x="674" y="236" font-size="12">whole clip (not re-verified)</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.567;1" dur="3s" fill="freeze"/><circle cx="660" cy="260" r="5" fill="#d29922"/><text x="674" y="264" font-size="12">one unexplained +5 instr in v1</text><text x="674" y="280" font-size="12">chunk c02</text></g><text x="480" y="440" font-size="12" class="mut" text-anchor="middle">Real DOOM engine, real guest code. Frames count as model-decoded only when the pixel bytes match the emulator byte for byte.</text></svg>