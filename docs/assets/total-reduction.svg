<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t"><title id="t">How much we pushed down in total</title>
<rect width="960" height="672" rx="16" fill="#0d1117" stroke="#30363d"/>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<text x="480" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#f1f3fa">📉 How much we pushed down, in total</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9aa3bb">grey = where we started · colour = where we are now</text>
<rect x="20" y="85" width="450" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="36" y="113" font-size="15" font-weight="700" fill="#e6edf3">Instructions per game tic</text>
<rect x="36" y="129" width="0" height="26" rx="6" fill="#6e7681"><animate attributeName="width" values="0;0;418.0;418.0;0" keyTimes="0;0.0500;0.1375;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="44" y="147" font-size="13" font-weight="700" fill="#10131c">10.47 M</text>
<rect x="36" y="163" width="0" height="26" rx="6" fill="#a77bff"><animate attributeName="width" values="0;0;17.1;17.1;0" keyTimes="0;0.1125;0.2125;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="61.1" y="181" font-size="13" font-weight="700" fill="#a77bff" opacity="0">0.43 M<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2000;0.2250;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="36" y="219" font-size="26" font-weight="800" fill="#a77bff" opacity="0">24x fewer<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2000;0.2250;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="36" y="240" font-size="11.5" fill="#8b949e">incl. 15 fps drawing + FULL preset</text>
<rect x="490" y="85" width="450" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="506" y="113" font-size="15" font-weight="700" fill="#e6edf3">Disk pauses (350 tics)</text>
<rect x="506" y="129" width="0" height="26" rx="6" fill="#6e7681"><animate attributeName="width" values="0;0;418.0;418.0;0" keyTimes="0;0.1188;0.2062;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="514" y="147" font-size="13" font-weight="700" fill="#10131c">165,054</text>
<rect x="506" y="163" width="0" height="26" rx="6" fill="#5b8def"><animate attributeName="width" values="0;0;4.0;4.0;0" keyTimes="0;0.1813;0.2812;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="518.0" y="181" font-size="13" font-weight="700" fill="#5b8def" opacity="0">4<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2687;0.2938;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="506" y="219" font-size="26" font-weight="800" fill="#5b8def" opacity="0">-99.998%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2687;0.2938;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="506" y="240" font-size="11.5" fill="#8b949e">host-served disk -> chunk ROM</text>
<rect x="20" y="269" width="450" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="36" y="297" font-size="15" font-weight="700" fill="#e6edf3">Instructions, 350 tics (exact cuts)</text>
<rect x="36" y="313" width="0" height="26" rx="6" fill="#6e7681"><animate attributeName="width" values="0;0;418.0;418.0;0" keyTimes="0;0.1875;0.2750;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="44" y="331" font-size="13" font-weight="700" fill="#10131c">180.6 M</text>
<rect x="36" y="347" width="0" height="26" rx="6" fill="#3ecf8e"><animate attributeName="width" values="0;0;347.8;347.8;0" keyTimes="0;0.2500;0.3500;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="391.8" y="365" font-size="13" font-weight="700" fill="#3ecf8e" opacity="0">150.2 M<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3375;0.3625;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="36" y="403" font-size="26" font-weight="800" fill="#3ecf8e" opacity="0">-16.8%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3375;0.3625;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="36" y="424" font-size="11.5" fill="#8b949e">chip tokens -19.4%</text>
<rect x="490" y="269" width="450" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="506" y="297" font-size="15" font-weight="700" fill="#e6edf3">Model speed (A100)</text>
<rect x="506" y="313" width="0" height="26" rx="6" fill="#6e7681"><animate attributeName="width" values="0;0;129.2;129.2;0" keyTimes="0;0.2563;0.3438;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="514" y="331" font-size="13" font-weight="700" fill="#10131c">1,100 instr/s</text>
<rect x="506" y="347" width="0" height="26" rx="6" fill="#ffd166"><animate attributeName="width" values="0;0;418.0;418.0;0" keyTimes="0;0.3188;0.4188;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="914" y="365" text-anchor="end" font-size="13" font-weight="700" fill="#10131c" opacity="0">3,562 instr/s<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4062;0.4313;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="506" y="403" font-size="26" font-weight="800" fill="#ffd166" opacity="0">3.2x faster<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4062;0.4313;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="506" y="424" font-size="11.5" fill="#8b949e">tokens/s: 1,454 -> 5,050</text>
<rect x="20" y="453" width="450" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="36" y="481" font-size="15" font-weight="700" fill="#e6edf3">Time per game tic on the model</text>
<rect x="36" y="497" width="0" height="26" rx="6" fill="#6e7681"><animate attributeName="width" values="0;0;418.0;418.0;0" keyTimes="0;0.3250;0.4125;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="44" y="515" font-size="13" font-weight="700" fill="#10131c">7.4 min</text>
<rect x="36" y="531" width="0" height="26" rx="6" fill="#ff9f6b"><animate attributeName="width" values="0;0;112.9;112.9;0" keyTimes="0;0.3875;0.4875;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="156.9" y="549" font-size="13" font-weight="700" fill="#ff9f6b" opacity="0">2.0 min<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4750;0.5000;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="36" y="587" font-size="26" font-weight="800" fill="#ff9f6b" opacity="0">3.7x faster<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4750;0.5000;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="36" y="608" font-size="11.5" fill="#8b949e">486 k instr / 1,100 vs 430 k / 3,562</text>
<rect x="490" y="453" width="450" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="506" y="481" font-size="15" font-weight="700" fill="#e6edf3">Time per displayed frame (projected)</text>
<rect x="506" y="497" width="0" height="26" rx="6" fill="#6e7681"><animate attributeName="width" values="0;0;418.0;418.0;0" keyTimes="0;0.3937;0.4812;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="514" y="515" font-size="13" font-weight="700" fill="#10131c">27 min</text>
<rect x="506" y="531" width="0" height="26" rx="6" fill="#e5726b"><animate attributeName="width" values="0;0;115.8;115.8;0" keyTimes="0;0.4562;0.5563;0.95;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="629.8" y="549" font-size="13" font-weight="700" fill="#e5726b" opacity="0">7.5 min<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5437;0.5687;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="506" y="587" font-size="26" font-weight="800" fill="#e5726b" opacity="0">3.6x faster<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5437;0.5687;0.95;1" dur="8.0s" repeatCount="indefinite"/></text>
<text x="506" y="608" font-size="11.5" fill="#8b949e">45 min with the original driver</text>
<text x="480" y="658" text-anchor="middle" font-size="11.5" fill="#7f88a3">Instruction and disk numbers: host emulator. Model speeds: measured on A100 (boot chunk). Per-frame time is a projection.</text>
</g></svg>