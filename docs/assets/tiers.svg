<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
<title id="t">Three executors, one CPU</title><desc id="d">One RISC-V program feeds three executors: T0 fast emulator, T1 reference oracle, T2 the Qwen model. Each hands back its state and bytes to a comparison step.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .mut{fill:#8b949e}</style>
<rect width="900" height="460" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="450" y="30" font-size="17" text-anchor="middle" font-weight="bold">one RISC-V program, three executors, same state, same bytes</text>
<rect x="24" y="170" width="150" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="99" y="205" font-size="14" text-anchor="middle" font-weight="bold">RV32IM program</text>
<text x="99" y="228" font-size="12" text-anchor="middle" class="mut">kernel + shell</text>
<text x="99" y="246" font-size="12" text-anchor="middle" class="mut">+ DOOM, one ELF</text>
<g font-size="13">
<rect x="270" y="60" width="270" height="86" rx="10" fill="#161b22" stroke="#58a6ff"/>
<text x="285" y="86" font-weight="bold" fill="#58a6ff" style="fill:#58a6ff">T0  fast emulator (rv32_fast)</text>
<text x="285" y="108" class="mut">millions of instr/s on a laptop CPU</text>
<text x="285" y="128" class="mut">plan, snapshot, benchmark, live demo</text>
<rect x="270" y="187" width="270" height="86" rx="10" fill="#161b22" stroke="#d29922"/>
<text x="285" y="213" font-weight="bold" style="fill:#d29922">T1  reference oracle (ref.Machine)</text>
<text x="285" y="235" class="mut">upstream Qwenputer reference CPU</text>
<text x="285" y="255" class="mut">checks every token of T2</text>
<rect x="270" y="314" width="270" height="86" rx="10" fill="#161b22" stroke="#3fb950"/>
<text x="285" y="340" font-weight="bold" style="fill:#3fb950">T2  the Qwen3.5-4B model (GPU)</text>
<text x="285" y="362" class="mut">about 3-4 thousand instr/s</text>
<text x="285" y="382" class="mut">the CPU actually inside the weights</text>
</g>
<g stroke="#30363d" stroke-width="2" fill="none">
<path d="M174 225 L222 225 L222 103 L270 103"/><path d="M174 225 L270 230"/><path d="M174 225 L222 225 L222 357 L270 357"/>
<path d="M540 103 L600 103 L600 210 L620 210"/><path d="M540 230 L620 230"/><path d="M540 357 L600 357 L600 250 L620 250"/>
</g>
<rect x="620" y="170" width="256" height="110" rx="10" fill="#161b22" stroke="#e6edf3"/>
<text x="748" y="206" font-size="14" text-anchor="middle" font-weight="bold">compare</text>
<text x="748" y="228" font-size="12" text-anchor="middle" class="mut">after every instruction / token</text>
<text x="748" y="250" font-size="12" text-anchor="middle" class="m" style="fill:#3fb950">same state, same bytes</text>
<text x="748" y="268" font-size="11" text-anchor="middle" class="mut">any mismatch stops the run</text>
<text x="748" y="320" font-size="12" text-anchor="middle" class="mut">T2 vs T1: every token</text>
<text x="748" y="338" font-size="12" text-anchor="middle" class="mut">T0 vs T1: state/frame hashes + lockstep</text>
<text x="450" y="440" font-size="12" text-anchor="middle" class="mut">observed equality on everything tested, not a mathematical proof</text>
<g>
<circle r="6" fill="#58a6ff"><animateMotion dur="4s" repeatCount="indefinite" path="M174 225 L222 225 L222 103 L270 103 M540 103 L600 103 L600 210 L620 210" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
<circle r="6" fill="#d29922"><animateMotion dur="4s" begin="0.4s" repeatCount="indefinite" path="M174 225 L270 230 M540 230 L620 230"/></circle>
<circle r="6" fill="#3fb950"><animateMotion dur="4s" begin="0.8s" repeatCount="indefinite" path="M174 225 L222 225 L222 357 L270 357 M540 357 L600 357 L600 250 L620 250"/></circle>
<rect x="620" y="170" width="256" height="110" rx="10" fill="none" stroke="#3fb950" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.6;0.75;1" dur="4s" repeatCount="indefinite"/></rect>
</g>
</svg>
