<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-labelledby="t d">
<title id="t">Chunking across GPUs</title><desc id="d">The 3-second clip is split into 35 chunks that fan out to GPUs and merge into a ledger. </desc>
