;0.34;0.4;0.46;1" dur="8s" repeatCount="indefinite"/></rect><rect x="380" y="206" width="120" height="50" rx="10" fill="#161b22" stroke="#30363d" ></rect><text x="440" y="228" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >GPU 3</text><text x="440" y="246" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" >verifies chunks</text><rect x="380" y="206" width="120" height="50" rx="10" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.44;0.5;0.56;1" dur="8s" repeatCount="indefinite"/></rect><rect x="380" y="274" width="120" height="50" rx="10" fill="#161b22" stroke="#30363d" ></rect><text x="440" y="296" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >GPU 4</text><text x="440" y="314" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" >verifies chunks</text><rect x="380" y="274" width="120" height="50" rx="10" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.54;0.6;0.66;1" dur="8s" repeatCount="indefinite"/></rect><rect x="380" y="342" width="120" height="50" rx="10" fill="#161b22" stroke="#30363d" ></rect><text x="440" y="364" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >GPU 5</text><text x="440" y="382" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" >verifies chunks</text><rect x="380" y="342" width="120" height="50" rx="10" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.64;0.7;0.76;1" dur="8s" repeatCount="indefinite"/></rect><text x="440" y="414" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" >29 Modal A100, 3 Lambda A100, 3 AWS A10G</text><path d="M210 120 C320 120 320 95 380 95" stroke="#30363d" stroke-width="2" fill="none"/><path d="M500 95 C640 95 640 230 700 230" stroke="#30363d" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M210 120 C320 120 3