sform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></line></g><text x="120" y="196" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="normal" >slow clock: each pause = stop, host patches the answer in, resume</text><text x="120" y="218" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >every disk request is a segment boundary</text><line x1="30" y1="260" x2="870" y2="260" stroke="#30363d" stroke-dasharray="4 6"/><text x="30" y="298" font-size="17" fill="#3fb950" text-anchor="start" font-weight="bold" >AFTER  chunk ROM</text><text x="870" y="298" font-size="15" fill="#e6edf3" text-anchor="end" font-weight="bold" class="m" >4 pauses, 0 inside doomd</text><rect x="30" y="316" width="840" height="26" rx="13" fill="#161b22" stroke="#30363d" ></rect><rect x="32" y="318" height="22" rx="11" fill="#3fb950" opacity="0.85" width="0"><animate attributeName="width" values="0;836;836" keyTimes="0;0.45;1" dur="10s" repeatCount="indefinite"/></rect><g transform="translate(50 372) scale(1)"><rect x="-6" y="-9" width="4" height="18" fill="#d29922" rx="1"/><rect x="2" y="-9" width="4" height="18" fill="#d29922" rx="1"/></g><g transform="translate(76 372) scale(1)"><rect x="-6" y="-9" width="4" height="18" fill="#d29922" rx="1"/><rect x="2" y="-9" width="4" height="18" fill="#d29922" rx="1"/></g><g transform="translate(102 372) scale(1)"><rect x="-6" y="-9" width="4" height="18" fill="#d29922" rx="1"/><rect x="2" y="-9" width="4" height="18" fill="#d29922" rx="1"/></g><g transform="translate(128 372) scale(1)"><rect x="-6" y="-9" width="4" height="18" fill="#d29922" rx="1"/><rect x="2" y="-9" width="4" height="18" fill="#d29922" rx="1"/></g><text x="170" y="377" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >4 tiny reads at boot, then it just flows</text><text x="30" y="430" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal" >data ROM (read-only, 128 KiB)</text><rect x="30" y="442" width="840" height="52" rx="10" fill="#161b22" stroke="#30363d" ></rect><rect x="230" y="448" width="440" height="40" rx="8" fill="#58a6ff" opacity="0.35"></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0001;0.005;0.2;0.205;1" dur="10s" repeatCount="indefinite"/><rect x="230" y="448" width="440" height="40" rx="8" fill="#58a6ff" opacity="0.9"></rect><text x="450" y="473" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >0x29000..0x3f000 (89 KB) · chunk 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.205;0.4;0.405;1" dur="10s" repeatCount="indefinite"/><rect x="230" y="448" width="440" height="40" rx="8" fill="#58a6ff" opacity="0.9"></rect><text x="450" y="473" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >0x29000..0x3f000 (89 KB) · chunk 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.405;0.6;0.605;1" dur="10s" repeatCount="indefinite"/><rect x="230" y="448" width="440" height="40" rx="8" fill="#58a6ff" opacity="0.9"></rect><text x="450" y="473" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >0x29000..0x3f000 (89 KB) · chunk 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.605;0.8;0.805;1" dur="10s" repeatCount="indefinite"/><rect x="230" y="448" width="440" height="40" rx="8" fill="#58a6ff" opacity="0.9"></rect><text x="450" y="473" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >0x29000..0x3f000 (89 KB) · chunk 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.805;1;1;1" dur="10s" repeatCount="indefinite"/><rect x="230" y="448" width="440" height="40" rx="8" fill="#58a6ff" opacity="0.9"></rect><text x="450" y="473" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >0x29000..0x3f000 (89 KB) · chunk 4</text></g><text x="870" y="430" font-size="13" fill="#e6edf3" text-anchor="end" font-weight="normal" >host pre-loads a window per chunk</text><text x="30" y="520" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" >price: +10.6 % instructions (485,801 -&gt; 538,573 per tic). a miss still falls back to the disk mailbox, so correctness never depends on the plan.</text><text x="30" y="540" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" >bars are illustrative, not to scale. numbers from MERGE_NOTES.md.</text></svg>
