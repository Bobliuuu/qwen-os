<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d"><title id="t">Speed ladder</title><desc id="d">Log-scale bars of seconds per displayed frame: original model speed, patched driver, projected now, and real time.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><defs></defs><rect width="900" height="420" rx="16" fill="#0d1117" stroke="#30363d"/><text x="450" y="32" font-size="16" text-anchor="middle" font-weight="bold">&#128640; Seconds per displayed frame (log scale: each tick is 10x)</text><line x1="250.0" y1="64" x2="250.0" y2="326" stroke="#30363d"/><text x="250.0" y="346" font-size="11" class="mut m" text-anchor="middle">0.01 s</text><line x1="346.6666666666667" y1="64" x2="346.6666666666667" y2="326" stroke="#30363d"/><text x="346.6666666666667" y="346" font-size="11" class="mut m" text-anchor="middle">0.1 s</text><line x1="443.33333333333337" y1="64" x2="443.33333333333337" y2="326" stroke="#30363d"/><text x="443.33333333333337" y="346" font-size="11" class="mut m" text-anchor="middle">1 s</text><line x1="540.0" y1="64" x2="540.0" y2="326" stroke="#30363d"/><text x="540.0" y="346" font-size="11" class="mut m" text-anchor="middle">10 s</text><line x1="636.6666666666667" y1="64" x2="636.6666666666667" y2="326" stroke="#30363d"/><text x="636.6666666666667" y="346" font-size="11" class="mut m" text-anchor="middle">100 s</text><line x1="733.3333333333333" y1="64" x2="733.3333333333333" y2="326" stroke="#30363d"/><text x="733.3333333333333" y="346" font-size="11" class="mut m" text-anchor="middle">1,000 s</text><line x1="830.0" y1="64" x2="830.0" y2="326" stroke="#30363d"/><text x="830.0" y="346" font-size="11" class="mut m" text-anchor="middle">10,000 s</text><text x="238" y="102" font-size="13" text-anchor="end">original driver (672 instr/s)</text><rect x="250" y="80" height="34" rx="6" fill="#f85149" width="525"><animate attributeName="width" values="0;0;525" keyTimes="0;0.000;1" dur="4s" fill="freeze"/></rect><text x="655" y="102" font-size="13" font-weight="bold" style="fill:#fff"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.356;0.444;1" dur="4.5s" fill="freeze"/>2,679 s (about 45 min)</text><text x="238" y="164" font-size="13" text-anchor="end">patched driver (1,679 instr/s)</text><rect x="250" y="142" height="34" rx="6" fill="#d29922" width="486"><animate attributeName="width" values="0;0;486" keyTimes="0;0.125;1" dur="4s" fill="freeze"/></rect><text x="655" y="164" font-size="13" font-weight="bold" style="fill:#fff"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.467;0.556;1" dur="4.5s" fill="freeze"/>1,072 s (about 18 min)</text><text x="238" y="226" font-size="13" text-anchor="end">Now, projected (3,121 instr/s)</text><rect x="250" y="204" height="34" rx="6" fill="#bc8cff" width="460"><animate attributeName="width" values="0;0;460" keyTimes="0;0.250;1" dur="4s" fill="freeze"/></rect><text x="655" y="226" font-size="13" font-weight="bold" style="fill:#fff"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.578;0.667;1" dur="4.5s" fill="freeze"/>577 s (projected 8-10 min)</text><text x="238" y="288" font-size="13" text-anchor="end">real time at 15 fps</text><rect x="250" y="266" height="34" rx="6" fill="#3fb950" width="80"><animate attributeName="width" values="0;0;80" keyTimes="0;0.375;1" dur="4s" fill="freeze"/></rect><text x="340" y="288" font-size="13" font-weight="bold" style="fill:#fff"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.689;0.778;1" dur="4.5s" fill="freeze"/>0.067 s</text><text x="450" y="378" font-size="14" text-anchor="middle">Gap to real time: at most <tspan font-weight="bold" fill="#f2c14e">about 8,600x</tspan> (577 s / 0.067 s) on this bar, down from about 16,000x</text><text x="450" y="400" font-size="11" class="mut" text-anchor="middle">derived: 1.80 M instr per frame / instr/s. The 3,121 instr/s is measured on one A100 chunk (c34, K=64 + fused kernels); the per-frame time is a projection.</text></svg>