<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d"><title id="t">Speed ladder</title><desc id="d">Log-scale bars of seconds per displayed frame: original model speed, patched A100 driver, and real time.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><rect width="900" height="360" rx="16" fill="#0d1117" stroke="#30363d"/><text x="450" y="32" font-size="16" text-anchor="middle" font-weight="bold">&#128640; Seconds per displayed frame (log scale: each tick is 10x)</text><line x1="230.0" y1="70" x2="230.0" y2="270" stroke="#30363d"/><text x="230.0" y="290" font-size="11" class="mut m" text-anchor="middle">0.01 s</text><line x1="330.0" y1="70" x2="330.0" y2="270" stroke="#30363d"/><text x="330.0" y="290" font-size="11" class="mut m" text-anchor="middle">0.1 s</text><line x1="430.0" y1="70" x2="430.0" y2="270" stroke="#30363d"/><text x="430.0" y="290" font-size="11" class="mut m" text-anchor="middle">1 s</text><line x1="530.0" y1="70" x2="530.0" y2="270" stroke="#30363d"/><text x="530.0" y="290" font-size="11" class="mut m" text-anchor="middle">10 s</text><line x1="630.0" y1="70" x2="630.0" y2="270" stroke="#30363d"/><text x="630.0" y="290" font-size="11" class="mut m" text-anchor="middle">100 s</text><line x1="730.0" y1="70" x2="730.0" y2="270" stroke="#30363d"/><text x="730.0" y="290" font-size="11" class="mut m" text-anchor="middle">1,000 s</text><line x1="830.0" y1="70" x2="830.0" y2="270" stroke="#30363d"/><text x="830.0" y="290" font-size="11" class="mut m" text-anchor="middle">10,000 s</text><text x="218" y="110" font-size="14" text-anchor="end">original model speed</text><rect x="230" y="88" height="34" rx="6" fill="#f85149" width="543"><animate attributeName="width" values="0;0;543" keyTimes="0;0.000;1" dur="4s" fill="freeze"/></rect><text x="660" y="110" font-size="13" font-weight="bold"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.356;0.444;1" dur="4.5s" fill="freeze"/>2,679 s  (about 45 min)</text><text x="218" y="172" font-size="14" text-anchor="end">patched A100 driver</text><rect x="230" y="150" height="34" rx="6" fill="#d29922" width="503"><animate attributeName="width" values="0;0;503" keyTimes="0;0.125;1" dur="4s" fill="freeze"/></rect><text x="660" y="172" font-size="13" font-weight="bold"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.467;0.556;1" dur="4.5s" fill="freeze"/>1,072 s  (about 18 min)</text><text x="218" y="234" font-size="14" text-anchor="end">real time at 15 fps</text><rect x="230" y="212" height="34" rx="6" fill="#3fb950" width="82"><animate attributeName="width" values="0;0;82" keyTimes="0;0.250;1" dur="4s" fill="freeze"/></rect><text x="322" y="234" font-size="13" font-weight="bold"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.578;0.667;1" dur="4.5s" fill="freeze"/>0.067 s</text><text x="450" y="322" font-size="14" text-anchor="middle">Gap to real time: <tspan font-weight="bold" fill="#f2c14e">about 16,000x</tspan> (1,072 s / 0.067 s)</text><text x="450" y="344" font-size="11" class="mut" text-anchor="middle">derived from the clip ledger: 81,065,587 instr / 45 frames = 1.80 M instr per frame, divided by instr/s (672 original, 1,679 median patched)</text></svg>