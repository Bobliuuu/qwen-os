<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Where the pixels come from</title><desc id="d">The DOOM engine draws a frame, a guest dump routine writes about 32,100 console bytes, the Qwen model emits each as a BYTE token, the lockstep oracle checks every token, and the host collects the bytes into a PNG.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="960" height="470" rx="16" fill="#0d1117" stroke="#30363d"/><text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle">&#127918; Where the pixels come from (v2): the model emits them</text><text x="480" y="56" font-size="12" class="mut" text-anchor="middle">every byte on the yellow trail is a BYTE token generated by the model and compared with the oracle</text><rect x="25" y="110" width="150" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><rect x="25" y="110" width="150" height="7" rx="3" fill="#58a6ff"/><text x="100.0" y="144" font-size="14" font-weight="bold" text-anchor="middle">&#128126; DOOM engine</text><text x="100.0" y="168" font-size="12" class="mut" text-anchor="middle">real DMC100-Doom</text><text x="100.0" y="186" font-size="12" class="mut" text-anchor="middle">RISC-V code in ROM</text><text x="100.0" y="204" font-size="12" class="mut" text-anchor="middle">draws the frame</text><rect x="215" y="110" width="150" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><rect x="215" y="110" width="150" height="7" rx="3" fill="#58a6ff"/><text x="290.0" y="144" font-size="14" font-weight="bold" text-anchor="middle">&#128228; LCD dump</text><text x="290.0" y="168" font-size="12" class="mut" text-anchor="middle">guest code, same ROM</text><text x="290.0" y="186" font-size="12" class="mut" text-anchor="middle">about 32,100 console</text><text x="290.0" y="204" font-size="12" class="mut" text-anchor="middle">bytes per frame</text><rect x="405" y="100" width="190" height="130" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><rect x="405" y="100" width="190" height="7" rx="3" fill="#bc8cff"/><text x="500.0" y="134" font-size="14" font-weight="bold" text-anchor="middle">&#129504; Qwen3.5-4B chip</text><text x="500.0" y="158" font-size="12" class="mut" text-anchor="middle">executes every instruction</text><text x="500.0" y="176" font-size="12" class="mut" text-anchor="middle">inside its weights and emits</text><text x="500.0" y="194" font-size="12" class="mut" text-anchor="middle">each pixel byte as a</text><text x="500.0" y="216" font-size="15" font-weight="bold" text-anchor="middle" style="fill:#fff">BYTE token</text><rect x="635" y="110" width="130" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><rect x="635" y="110" width="130" height="7" rx="3" fill="#3fb950"/><text x="700.0" y="144" font-size="14" font-weight="bold" text-anchor="middle">&#9989; Lockstep oracle</text><text x="700.0" y="168" font-size="12" class="mut" text-anchor="middle">checks every token</text><text x="700.0" y="186" font-size="12" class="mut" text-anchor="middle">vs reference CPU</text><rect x="795" y="110" width="140" height="110" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/><rect x="795" y="110" width="140" height="7" rx="3" fill="#8b949e"/><text x="865.0" y="144" font-size="14" font-weight="bold" text-anchor="middle">&#128421; Host</text><text x="865.0" y="168" font-size="12" class="mut" text-anchor="middle">collects the bytes,</text><text x="865.0" y="186" font-size="12" class="mut" text-anchor="middle">palette, writes PNG</text><path d="M175 165 H212" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M365 165 H402" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M595 165 H632" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path d="M765 165 H792" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="405" y="100" width="190" height="130" rx="12" fill="#bc8cff" opacity="0"><animate attributeName="opacity" values="0.05;0.25;0.05" dur="2.4s" repeatCount="indefinite"/></rect><circle r="5" fill="#f2c14e"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M175,165 H935"/></circle><circle r="5" fill="#f2c14e"><animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M175,165 H935"/></circle><circle r="5" fill="#f2c14e"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M175,165 H935"/></circle><circle r="5" fill="#f2c14e"><animateMotion dur="3s" begin="1.7999999999999998s" repeatCount="indefinite" path="M175,165 H935"/></circle><circle r="5" fill="#f2c14e"><animateMotion dur="3s" begin="2.4s" repeatCount="indefinite" path="M175,165 H935"/></circle><rect x="25" y="262" width="430" height="108" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.5"/><text x="240" y="288" font-size="14" font-weight="bold" text-anchor="middle">v1: pixels read by the host</text><text x="240" y="312" font-size="12" class="mut" text-anchor="middle">The model checked every instruction and stored value.</text><text x="240" y="332" font-size="12" class="mut" text-anchor="middle">The emulator read the frame out of guest memory.</text><text x="240" y="355" font-size="12" font-weight="bold" text-anchor="middle" style="fill:#f85149">pixels: host-read</text><rect x="505" y="262" width="430" height="108" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="720" y="288" font-size="14" font-weight="bold" text-anchor="middle">v2: pixels emitted by the model</text><text x="720" y="312" font-size="12" class="mut" text-anchor="middle">The model generates the pixel bytes itself;</text><text x="720" y="332" font-size="12" class="mut" text-anchor="middle">every token is checked in lockstep.</text><text x="720" y="355" font-size="12" font-weight="bold" text-anchor="middle" style="fill:#3fb950">pixels: model-emitted (rows 0-199)</text><rect x="25" y="398" width="14" height="14" rx="3" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="47" y="410" font-size="12" class="mut">in the model</text><rect x="165" y="398" width="14" height="14" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="187" y="410" font-size="12" class="mut">verifier</text><rect x="265" y="398" width="14" height="14" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="287" y="410" font-size="12" class="mut">host (keys, disk, PNG)</text><rect x="470" y="398" width="14" height="14" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="492" y="410" font-size="12" class="mut">guest code (runs inside the model)</text><circle cx="745" cy="405" r="5" fill="#f2c14e"/><text x="757" y="410" font-size="12" class="mut">one pixel byte</text><text x="480" y="444" font-size="11" class="mut" text-anchor="middle">Status-bar rows 208-239 are not in a frame's dump. Palette and PNG assembly happen on the host. How many frames are done: see the README progress line.</text></svg>