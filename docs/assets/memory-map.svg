<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" role="img" aria-labelledby="t d">
<title id="t">RAM and ROM maps</title><desc id="d">The 32 KiB RAM map and the ROM map with the chunk window.</desc>
