#30363d" ></rect><text x="94" y="252" font-size="12" fill="#bc8cff" text-anchor="start" font-weight="bold" class="m" >0x270</text><text x="160" y="252" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal" >framebuffer 32x24</text><rect x="60" y="274" width="360" height="330" rx="8" fill="#161b22" stroke="#30363d" ></rect><rect x="60" y="274" width="8" height="330" rx="4" fill="#d29922" ></rect><text x="84" y="300" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="bold" >doomd RAM</text><text x="84" y="320" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" class="m" >0x0570..0x8000  (30,800 B)</text><text x="52" y="286" font-size="11" fill="#8b949e" text-anchor="end" font-weight="normal" class="m" >0x0570</text><rect x="84" y="336" width="312" height="60" rx="6" fill="#ff9e64" opacity="0.35"></rect><text x="240.0" y="371" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="normal" >data + frame region</text><rect x="84" y="404" width="312" height="100" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"></rect><text x="240.0" y="459" font-size="13" fill="#8b949e" text-anchor="middle" font-weight="normal" >rest of doomd RAM</text><rect x="84" y="514" width="312" height="60" rx="6" fill="#3fb950" opacity="0.3"></rect><text x="240.0" y="539" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="normal" >stack, grows down (960 of 1,408 B used)</text><path d="M240.0 546 v18 m-6 -6 l6 6 l6 -6" stroke="#3fb950" stroke-width="3" fill="none"><animateTransform attributeName="transform" type="translate" values="0 -3;0 3;0 -3" dur="1.2s" repeatCount="indefinite"/></path><text x="52" y="614" font-size="11" fill="#8b949e" text-anchor="end" font-weight="normal" class="m" >0x8000</text><rect x="60" y="56" width="360" height="6" fill="#58a6ff" opacity="0.5" rx="3"><animate attributeName="y" values="56;598;56" dur="8s" repeatCount="indefinite"/></rect><rect x="490" y="56" width="360" height="150" rx="8" fill="#161b22" stroke="#30363d" ></rect><rect x="490" y="56" width="8" height="150" rx="4" fill="#58a6ff" ></rect><text x="514" y="86" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="bold" >exec ROM</text><text x="514" y="108" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" >256 KiB, all the code (the CPU can't run from RAM)</text><text x="514" y="140" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal" >kernel, shell, doomd, engine</text><rect x="490" y="214" width="360" height="330" rx="8" fill="#161b22" stroke="#30363d" ></rect><rect x="490" y="214" width="8" height="330" rx="4" fill="#3fb950" ></rect><text x="514" y="244" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="bold" >data ROM</text><text x="514" y="266" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" >128 KiB, read-only data</text><rect x="514" y="290" width="312" height="60" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"></rect><text x="670.0" y="325" font-size="13" fill="#8b949e" text-anchor="middle" font-weight="normal" >rest of data ROM</text><rect x="514" y="362" width="312" height="120" rx="8" fill="#58a6ff" opacity="0.25"></rect><text x="670.0" y="392" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="bold" >chunk window</text><text x="670.0" y="414" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="normal" class="m" >0x29000 .. 0x3f000  (89 KB)</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0001;0.005;0.2;0.205;1" dur="8s" repeatCount="indefinite"/><rect x="514" y="362" width="312" height="120" rx="8" fill="#58a6ff" opacity="0.6"></rect><text x="670.0" y="392" font-size="15" fill="#0d1117" text-anchor="middle" font-weight="bold" >chunk window</text><text x="670.0" y="414" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" class="m" >0x29000 .. 0x3f000  (89 KB)</text><text x="670.0" y="448" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" >contents for chunk 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.205;0.4;0.405;1" dur="8s" repeatCount="indefinite"/><rect x="514" y="362" width="312" height="120" rx="8" fill="#58a6ff" opacity="0.6"></rect><text x="670.0" y="392" font-size="15" fill="#0d1117" text-anchor="middle" font-weight="bold" >chunk window</text><text x="670.0" y="414" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" class="m" >0x29000 .. 0x3f000  (89 KB)</text><text x="670.0" y="448" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" >contents for chunk 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.405;0.6;0.605;1" dur="8s" repeatCount="indefinite"/><rect x="514" y="362" width="312" height="120" rx="8" fill="#58a6ff" opacity="0.6"></rect><text x="670.0" y="392" font-size="15" fill="#0d1117" text-anchor="middle" font-weight="bold" >chunk window</text><text x="670.0" y="414" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" class="m" >0x29000 .. 0x3f000  (89 KB)</text><text x="670.0" y="448" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" >contents for chunk 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.605;0.8;0.805;1" dur="8s" repeatCount="indefinite"/><rect x="514" y="362" width="312" height="120" rx="8" fill="#58a6ff" opacity="0.6"></rect><text x="670.0" y="392" font-size="15" fill="#0d1117" text-anchor="middle" font-weight="bold" >chunk window</text><text x="670.0" y="414" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" class="m" >0x29000 .. 0x3f000  (89 KB)</text><text x="670.0" y="448" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" >contents for chunk 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.805;1;1;1" dur="8s" repeatCount="indefinite"/><rect x="514" y="362" width="312" height="120" rx="8" fill="#58a6ff" opacity="0.6"></rect><text x="670.0" y="392" font-size="15" fill="#0d1117" text-anchor="middle" font-weight="bold" >chunk window</text><text x="670.0" y="414" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" class="m" >0x29000 .. 0x3f000  (89 KB)</text><text x="670.0" y="448" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="normal" >contents for chunk 4</text></g><text x="514" y="512" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" >host swaps the window at planned frame markers</text><text x="30" y="664" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" >misses still fall back to the disk mailbox (0x15c), so the plan only affects speed.</text><text x="30" y="686" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" >sources: MERGE_NOTES.md, README numbers. Region heights are for readability.</text></svg>
