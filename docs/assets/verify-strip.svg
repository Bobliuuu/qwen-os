<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">How a model run is verified</title><desc id="d">A timeline strip: host snapshot, model generates tokens, oracle compares, segment ok, next snapshot, repeat.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .mut{fill:#8b949e}</style>
<rect width="900" height="300" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="450" y="32" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="bold" >how a model run is verified: a chain of segments</text><rect x="27.0" y="70" width="150" height="84" rx="12" fill="#161b22" stroke="#30363d" ></rect><rect x="27.0" y="70" width="150" height="6" rx="3" fill="#3fb950" ></rect><text x="102.0" y="110" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >host snapshot</text><text x="102.0" y="130" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal" >machine state</text><rect x="27.0" y="70" width="150" height="84" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.01;0.05;0.09;1" dur="10s" repeatCount="indefinite"/></rect><path d="M180.0 112.0 h16 m-5 -5 l5 5 l-5 5" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="201.0" y="70" width="150" height="84" rx="12" fill="#161b22" stroke="#30363d" ></rect><rect x="201.0" y="70" width="150" height="6" rx="3" fill="#58a6ff" ></rect><text x="276.0" y="110" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >model generates</text><text x="276.0" y="130" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal" >chip tokens</text><rect x="201.0" y="70" width="150" height="84" rx="12" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.18;0.22;0.26;1" dur="10s" repeatCount="indefinite"/></rect><path d="M354.0 112.0 h16 m-5 -5 l5 5 l-5 5" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="375.0" y="70" width="150" height="84" rx="12" fill="#161b22" stroke="#30363d" ></rect><rect x="375.0" y="70" width="150" height="6" rx="3" fill="#bc8cff" ></rect><text x="450.0" y="110" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >oracle compares</text><text x="450.0" y="130" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal" >every token</text><rect x="375.0" y="70" width="150" height="84" rx="12" fill="#bc8cff" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.35;0.39;0.43;1" dur="10s" repeatCount="indefinite"/></rect><path d="M528.0 112.0 h16 m-5 -5 l5 5 l-5 5" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="549.0" y="70" width="150" height="84" rx="12" fill="#161b22" stroke="#30363d" ></rect><rect x="549.0" y="70" width="150" height="6" rx="3" fill="#3fb950" ></rect><text x="624.0" y="110" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >segment ok</text><text x="624.0" y="130" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal" >count + marker match</text><rect x="549.0" y="70" width="150" height="84" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.52;0.56;0.6;1" dur="10s" repeatCount="indefinite"/></rect><path d="M702.0 112.0 h16 m-5 -5 l5 5 l-5 5" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="723.0" y="70" width="150" height="84" rx="12" fill="#161b22" stroke="#30363d" ></rect><rect x="723.0" y="70" width="150" height="6" rx="3" fill="#3fb950" ></rect><text x="798.0" y="110" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" >next snapshot</text><text x="798.0" y="130" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal" >+ disk bytes</text><rect x="723.0" y="70" width="150" height="84" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.69;0.73;0.77;1" dur="10s" repeatCount="indefinite"/></rect><rect x="209.0" y="168" width="10" height="14" rx="2" fill="#58a6ff" opacity="0.0"><animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.2;0.205;0.42;0.425;1" dur="10s" repeatCount="indefinite"/></rect><rect x="222.5" y="168" width="10" height="14" rx="2" fill="#58a6ff" opacity="0.0"><animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.21;0.215;0.42;0.425;1" dur="10s" repeatCount="