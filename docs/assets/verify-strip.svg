6" fill="#161b22" stroke="#30363d" ></rect><rect x="782" y="198" width="52" height="26" rx="6" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.875;0.885;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></rect><text x="808" y="216" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >...<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.875;0.885;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text><text x="30" y="262" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal" >zero divergence means: inside every segment, every chip token matched the oracle. the video pixels come from the emulator; the model vouches for the trace.</text><text x="30" y="280" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal" >on the model so far: probe, title frame (6,563 instr), cold boot to first frame marker (1,552,382 instr, 292 segments).</text></svg>
