ues="0;0;1;1;0;0" keyTimes="0;0.275;0.285;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text><rect x="348" y="198" width="52" height="26" rx="6" fill="#161b22" stroke="#30363d" ></rect><rect x="348" y="198" width="52" height="26" rx="6" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.35;0.36;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></rect><text x="374" y="216" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >seg 5<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.36;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text><rect x="410" y="198" width="52" height="26" rx="6" fill="#161b22" stroke="#30363d" ></rect><rect x="410" y="198" width="52" height="26" rx="6" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.425;0.435;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></rect><text x="436" y="216" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >seg 6<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.425;0.435;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text><rect x="472" y="198" width="52" height="26" rx="6" fill="#161b22" stroke="#30363d" ></rect><rect x="472" y="198" width="52" height="26" rx="6" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.5;0.51;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></rect><text x="498" y="216" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold" class="m" >seg 7<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.98;0.99;1" dur="10s" repeatCount="indefinite"/></text><rect x="534" y="198" width="52" height="26" rx="6" fill="#161b22" stroke="#30363d" ></rect><rect x="534" y="198" width="52" height="26" rx="6" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.575;0.58