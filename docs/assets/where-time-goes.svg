<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d"><title id="t">Where the time goes</title><desc id="d">A guest instruction becomes chip tokens, runs as one GPU step, loops through the host, and is checked by the verifier.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><rect width="900" height="330" rx="16" fill="#0d1117" stroke="#30363d"/><text x="450" y="32" font-size="16" text-anchor="middle" font-weight="bold">&#9201; Where the time goes: one instruction, five stops</text><rect x="35" y="90" width="140" height="110" rx="12" fill="#161b22" stroke="#30363d"/><rect x="35" y="90" width="140" height="8" rx="4" fill="#58a6ff"/><text x="105.0" y="138" font-size="30" text-anchor="middle">1</text><text x="105.0" y="166" font-size="14" font-weight="bold" text-anchor="middle">guest instruction</text><text x="105.0" y="186" font-size="11" class="mut" text-anchor="middle">one RV32 op from DOOM</text><rect x="35" y="90" width="140" height="110" rx="12" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0.020;0.070;0.170;1" dur="6s" repeatCount="indefinite"/></rect><path d="M179 145 h20 m-6 -6 l6 6 l-6 6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="205" y="90" width="140" height="110" rx="12" fill="#161b22" stroke="#30363d"/><rect x="205" y="90" width="140" height="8" rx="4" fill="#bc8cff"/><text x="275.0" y="138" font-size="30" text-anchor="middle">2</text><text x="275.0" y="166" font-size="14" font-weight="bold" text-anchor="middle">chip tokens</text><text x="275.0" y="186" font-size="11" class="mut" text-anchor="middle">about 1.345 per instr</text><rect x="205" y="90" width="140" height="110" rx="12" fill="#bc8cff" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0.220;0.270;0.370;1" dur="6s" repeatCount="indefinite"/></rect><path d="M349 145 h20 m-6 -6 l6 6 l-6 6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="375" y="90" width="140" height="110" rx="12" fill="#161b22" stroke="#30363d"/><rect x="375" y="90" width="140" height="8" rx="4" fill="#ff6bd6"/><text x="445.0" y="138" font-size="30" text-anchor="middle">3</text><text x="445.0" y="166" font-size="14" font-weight="bold" text-anchor="middle">GPU step</text><text x="445.0" y="186" font-size="11" class="mut" text-anchor="middle">the model runs the circuit</text><rect x="375" y="90" width="140" height="110" rx="12" fill="#ff6bd6" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0.420;0.470;0.570;1" dur="6s" repeatCount="indefinite"/></rect><path d="M519 145 h20 m-6 -6 l6 6 l-6 6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="545" y="90" width="140" height="110" rx="12" fill="#161b22" stroke="#30363d"/><rect x="545" y="90" width="140" height="8" rx="4" fill="#d29922"/><text x="615.0" y="138" font-size="30" text-anchor="middle">4</text><text x="615.0" y="166" font-size="14" font-weight="bold" text-anchor="middle">host loop</text><text x="615.0" y="186" font-size="11" class="mut" text-anchor="middle">snapshots, disk, keys</text><rect x="545" y="90" width="140" height="110" rx="12" fill="#d29922" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0.620;0.670;0.770;1" dur="6s" repeatCount="indefinite"/></rect><path d="M689 145 h20 m-6 -6 l6 6 l-6 6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="715" y="90" width="140" height="110" rx="12" fill="#161b22" stroke="#30363d"/><rect x="715" y="90" width="140" height="8" rx="4" fill="#3fb950"/><text x="785.0" y="138" font-size="30" text-anchor="middle">5</text><text x="785.0" y="166" font-size="14" font-weight="bold" text-anchor="middle">verify</text><text x="785.0" y="186" font-size="11" class="mut" text-anchor="middle">lockstep oracle compares</text><rect x="715" y="90" width="140" height="110" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0.820;0.870;0.970;1" dur="6s" repeatCount="indefinite"/></rect><line x1="105.0" y1="225" x2="785.0" y2="225" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6"/><g><circle r="10" fill="#f2c14e"/><animateMotion dur="6s" repeatCount="indefinite" path="M105.0,225 H785.0" calcMode="linear"/></g><text x="450" y="265" font-size="14" text-anchor="middle">At the measured median of 1,679 instr/s, <tspan font-weight="bold" fill="#f2c14e">one instruction takes about 0.6 milliseconds</tspan> end to end.</text><text x="450" y="290" font-size="12" class="mut" text-anchor="middle">derived: 1 / 1,679 per second. A DOOM frame needs about 1.8 million of these trips.</text><text x="450" y="312" font-size="11" class="mut" text-anchor="middle">The loop repeats for every instruction; the GPU generating chip tokens one after another is the bulk of it.</text></svg>